# Publishes @shedcollective/neat-os to GitHub Packages when a Release is published.
# GitHub runs this file from the default branch. The job checks out the release tag
# so the tarball matches that tag. The tag commit must be reachable from main.
# Agents still install from git (ADR-0019). The licence is MIT.

name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Require the release tag on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --prune origin +refs/heads/main:refs/remotes/origin/main
          sha="$(git rev-parse "HEAD")"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "Publish the Release targeting main after merging release/X.Y.Z." >&2
            echo "Tag ${RELEASE_TAG} (${sha}) is not reachable from origin/main." >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG}" != "v${version}" ]; then
            echo "release tag ${RELEASE_TAG} does not match package.json version ${version}" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@shedcollective'
      - name: Verify the tarball includes stacks and skills
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          npm pack --dry-run > pack-list.txt 2>&1
          grep -q 'skills/' pack-list.txt
          grep -q 'stacks/' pack-list.txt
          echo "tarball for ${RELEASE_TAG} includes skills/ and stacks/"
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish
